name: release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.8.0
      - name: Cut version, changelog, and tag
        id: cut
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          before="$(git tag -l 'v[0-9]*' | sort)"
          scripts/release.sh --push
          after="$(git tag -l 'v[0-9]*' | sort)"
          tag="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -n1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new tag: ${tag:-none}"
      - name: GitHub Release
        if: steps.cut.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.cut.outputs.tag }}"
          git-cliff --latest --strip all | gh release create "$tag" --title "$tag" --notes-file -
          gh workflow run ci.yml --ref "$tag"
