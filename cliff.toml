# git-cliff — CHANGELOG.md is generated from git history.
# Version tags (v0.1.0, …) are created when commits land on `release`.

[changelog]
header = """
# Changelog

All notable changes to soooski are documented in this file.

Version numbers are assigned when commits land on the `release` branch.
The first release is 0.1.0.
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}\
{% endfor %}
"""
footer = """
"""
trim = true
render_always = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^[Ff]eat", group = "Features" },
  { message = "^[Aa]dd ", group = "Features" },
  { message = "^[Rr]ebuild ", group = "Features" },
  { message = "^[Mm]ake ", group = "Features" },
  { message = "^[Ff]ix", group = "Bug Fixes" },
  { message = "^[Dd]oc", group = "Documentation" },
  { message = "^[Cc]hore", group = "Miscellaneous" },
  { message = "^[Rr]emove ", group = "Miscellaneous" },
  { message = "^[Uu]se ", group = "Changes" },
  { message = ".*", group = "Changes" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.1.0"
custom_minor_increment_regex = "(?i)^(feat|add |rebuild |make )"
